name: Build games

# On every push to main, rebuild the dist/ of each game folder that changed and
# commit it back, so the GitHub Pages links in the README serve the latest build.
# Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/dist/**"
      - "README.md"
      - "screenshots/**"
  workflow_dispatch:
    inputs:
      games:
        description: "Space-separated game folders to build (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-games
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed games
        id: games
        shell: bash
        run: |
          all=""
          for d in */; do
            d=${d%/}
            if [ -f "$d/package.json" ]; then all="$all $d"; fi
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            games="${{ github.event.inputs.games }}"
            if [ -z "$games" ]; then games="$all"; fi
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              # New branch or force push: no usable base, build everything.
              games="$all"
            else
              changed=$(git diff --name-only "$before" "${{ github.sha }}" | grep -v '/dist/' | cut -d/ -f1 | sort -u || true)
              games=""
              for d in $changed; do
                if [ -f "$d/package.json" ]; then games="$games $d"; fi
              done
            fi
          fi

          games=$(echo $games)
          echo "Games to build: ${games:-none}"
          echo "list=$games" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.games.outputs.list != ''
        with:
          node-version: 22

      - name: Build
        if: steps.games.outputs.list != ''
        shell: bash
        run: |
          for game in ${{ steps.games.outputs.list }}; do
            echo "::group::$game"
            (cd "$game" && npm ci --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

      - name: Commit builds
        if: steps.games.outputs.list != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for game in ${{ steps.games.outputs.list }}; do
            git add -A "$game/dist"
          done
          if git diff --cached --quiet; then
            echo "Builds unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Build: ${{ steps.games.outputs.list }}"
          git pull --rebase origin main
          git push origin HEAD:main
